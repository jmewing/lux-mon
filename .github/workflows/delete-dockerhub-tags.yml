name: Delete Contaminated Docker Hub Tags

on:
  workflow_dispatch:

jobs:
  delete-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          # Get a JWT for the Hub API
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          if [ -z "$TOKEN" ]; then
            echo "ERROR: failed to get Hub API token"
            exit 1
          fi
          echo "Got Hub API token (length ${#TOKEN})"
          for tag in latest dev v1.1.4 v1.1.3 v1.1.0 v1.0 v1.1.0-beta.1 v1.0.1; do
            echo "--- deleting $tag ---"
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/lux-mon/tags/${tag}/" \
              -H "Authorization: JWT ${TOKEN}")
            echo "  HTTP $code"
          done
