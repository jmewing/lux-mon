version: "3.8"

# -----------------------------------------------------------------------------
# One-command lux-mon stack (Docker Compose)
#
# 1. Copy docker/.env.example to the repository root as .env and fill it in.
# 2. From the repository root run:
#        docker compose -f docker/docker-compose.yml up -d
# 3. Dashboards:
#      Web UI/API: http://<host>:80/
#      Grafana:    http://<host>:3000/
# -----------------------------------------------------------------------------

x-lux-env: &lux-env
  LUX_DONGLE_HOST: ${LUX_DONGLE_HOST}
  LUX_DONGLE_PORT: ${LUX_DONGLE_PORT:-8000}
  LUX_TRANSPORT: ${LUX_TRANSPORT:-tcp_active}
  LUX_INVERTER_MODEL: ${LUX_INVERTER_MODEL:-eg4_6000xp}
  LUX_DATALOG_SERIAL: ${LUX_DATALOG_SERIAL}
  LUX_INVERTER_SERIAL: ${LUX_INVERTER_SERIAL}
  LUX_WRITE_INTERVAL: ${LUX_WRITE_INTERVAL:-5}

  # MariaDB
  LUX_MARIADB_HOST: mariadb
  LUX_MARIADB_PORT: 3306
  LUX_MARIADB_USER: ${LUX_MARIADB_USER:-luxmon}
  LUX_MARIADB_PASSWORD: ${LUX_MARIADB_PASSWORD}
  LUX_MARIADB_DATABASE: ${LUX_MARIADB_DATABASE:-luxmon}
  LUX_MARIADB_TABLE_PREFIX: ${LUX_MARIADB_TABLE_PREFIX:-lux_}
  # Legacy aliases for v1.0 image compatibility; remove after v1.0.1 rebuild.
  LUX_DB_HOST: mariadb
  LUX_DB_USER: ${LUX_MARIADB_USER:-luxmon}
  LUX_DB_PASSWORD: ${LUX_MARIADB_PASSWORD}
  LUX_DB_NAME: ${LUX_MARIADB_DATABASE:-luxmon}
  LUX_DB_PORT: 3306

  # InfluxDB v2
  LUX_INFLUX_ENABLED: ${LUX_INFLUX_ENABLED:-true}
  LUX_INFLUX_URL: http://influxdb:8086
  LUX_INFLUX_TOKEN: ${LUX_INFLUX_TOKEN}
  LUX_INFLUX_ORG: ${LUX_INFLUX_ORG:-luxmon}
  LUX_INFLUX_BUCKET: ${LUX_INFLUX_BUCKET:-luxmon}

  # MQTT
  LUX_MQTT_ENABLED: ${LUX_MQTT_ENABLED:-true}
  LUX_MQTT_HOST: mosquitto
  LUX_MQTT_PORT: 1883
  LUX_MQTT_USERNAME: ${LUX_MQTT_USERNAME}
  LUX_MQTT_PASSWORD: ${LUX_MQTT_PASSWORD}
  LUX_MQTT_TOPIC_PREFIX: ${LUX_MQTT_TOPIC_PREFIX:-luxmon}
  LUX_MQTT_HA_DISCOVERY: ${LUX_MQTT_HA_DISCOVERY:-true}
  LUX_MQTT_HA_PREFIX: ${LUX_MQTT_HA_PREFIX:-homeassistant}
  LUX_MQTT_DEVICE_NAME: ${LUX_MQTT_DEVICE_NAME:-luxmon}
  LUX_MQTT_DEVICE_ID: ${LUX_MQTT_DEVICE_ID:-luxmon_solar}

  # Alerts
  LUX_ALERTS_ENABLED: ${LUX_ALERTS_ENABLED:-false}
  LUX_ALERTS_SOC_LOW: ${LUX_ALERTS_SOC_LOW:-20}
  LUX_ALERTS_SOC_CRITICAL: ${LUX_ALERTS_SOC_CRITICAL:-10}
  LUX_ALERTS_BATTERY_TEMP_HIGH: ${LUX_ALERTS_BATTERY_TEMP_HIGH:-50}
  LUX_ALERTS_INVERTER_TEMP_HIGH: ${LUX_ALERTS_INVERTER_TEMP_HIGH:-60}
  LUX_ALERTS_GRID_LOST_THRESHOLD_SEC: ${LUX_ALERTS_GRID_LOST_THRESHOLD_SEC:-30}
  LUX_ALERTS_EMAIL_ENABLED: ${LUX_ALERTS_EMAIL_ENABLED:-false}
  LUX_ALERTS_EMAIL_SMTP_HOST: ${LUX_ALERTS_EMAIL_SMTP_HOST}
  LUX_ALERTS_EMAIL_SMTP_PORT: ${LUX_ALERTS_EMAIL_SMTP_PORT:-587}
  LUX_ALERTS_EMAIL_USERNAME: ${LUX_ALERTS_EMAIL_USERNAME}
  LUX_ALERTS_EMAIL_PASSWORD: ${LUX_ALERTS_EMAIL_PASSWORD}
  LUX_ALERTS_EMAIL_FROM: ${LUX_ALERTS_EMAIL_FROM}
  LUX_ALERTS_EMAIL_TO: ${LUX_ALERTS_EMAIL_TO}
  LUX_ALERTS_EMAIL_TLS: ${LUX_ALERTS_EMAIL_TLS:-true}
  LUX_ALERTS_WEBHOOK_ENABLED: ${LUX_ALERTS_WEBHOOK_ENABLED:-false}
  LUX_ALERTS_WEBHOOK_URL: ${LUX_ALERTS_WEBHOOK_URL}

services:
  mariadb:
    image: mariadb:10.11
    container_name: lux-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LUX_MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${LUX_MARIADB_DATABASE:-luxmon}
      MARIADB_USER: ${LUX_MARIADB_USER:-luxmon}
      MARIADB_PASSWORD: ${LUX_MARIADB_PASSWORD}
    volumes:
      - lux-mariadb-data:/var/lib/mysql
    networks:
      - lux-mon-net
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -uroot -p"$${MARIADB_ROOT_PASSWORD}" | grep "mysqld is alive"'
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2.7
    container_name: lux-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${LUX_INFLUX_USERNAME:-luxmon}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${LUX_INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${LUX_INFLUX_ORG:-luxmon}
      DOCKER_INFLUXDB_INIT_BUCKET: ${LUX_INFLUX_BUCKET:-luxmon}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${LUX_INFLUX_TOKEN}
    volumes:
      - lux-influxdb-data:/var/lib/influxdb2
    networks:
      - lux-mon-net
    healthcheck:
      test:
        - CMD-SHELL
        - "influx ping || exit 1"
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb-init:
    image: influxdb:2.7
    container_name: lux-influxdb-init
    environment:
      INFLUX_HOST: http://influxdb:8086
      INFLUX_ORG: ${LUX_INFLUX_ORG:-luxmon}
      INFLUX_TOKEN: ${LUX_INFLUX_TOKEN}
    volumes:
      - ./influxdb-init.sh:/init.sh:ro
    networks:
      - lux-mon-net
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"
    command: ["/init.sh"]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lux-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - lux-mosquitto-data:/mosquitto/data
      - lux-mosquitto-logs:/mosquitto/log
    networks:
      - lux-mon-net

  db-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${LUX_IMAGE:-lux-mon:local}
    container_name: lux-db-init
    environment:
      <<: *lux-env
    networks:
      - lux-mon-net
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"
    command:
      - python
      - -c
      - |
        import os, sys
        sys.path.insert(0, os.path.dirname(os.path.abspath('__file__')))
        from collector.outputs import Outputs, OutputConfig
        c = OutputConfig(
          mariadb_enabled=True,
          mariadb_host=os.environ['LUX_MARIADB_HOST'],
          mariadb_port=int(os.environ['LUX_MARIADB_PORT']),
          mariadb_user=os.environ['LUX_MARIADB_USER'],
          mariadb_password=os.environ['LUX_MARIADB_PASSWORD'],
          mariadb_database=os.environ['LUX_MARIADB_DATABASE'],
          mariadb_table_prefix=os.environ['LUX_MARIADB_TABLE_PREFIX'],
          influx_enabled=False,
          mqtt_enabled=False,
        )
        Outputs(c)
        print('MariaDB schema initialized')

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${LUX_IMAGE:-lux-mon:local}
    container_name: lux-collector
    restart: unless-stopped
    environment:
      <<: *lux-env
    networks:
      - lux-mon-net
    depends_on:
      mariadb:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      influxdb-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${LUX_IMAGE:-lux-mon:local}
    container_name: lux-api
    restart: unless-stopped
    command: ["python", "-m", "api"]
    environment:
      <<: *lux-env
      LUX_API_HOST: 0.0.0.0
      LUX_API_PORT: 80
    ports:
      - "80:80"
    networks:
      - lux-mon-net
    depends_on:
      mariadb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:80/api/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  grafana-init:
    image: alpine:latest
    container_name: lux-grafana-init
    environment:
      LUX_INFLUX_TOKEN: ${LUX_INFLUX_TOKEN}
    volumes:
      - ../grafana/provisioning:/src/provisioning:ro
      - ../grafana/dashboards:/src/dashboards:ro
      - lux-grafana-provisioning:/dst/provisioning
      - lux-grafana-dashboards:/dst/dashboards
    networks:
      - lux-mon-net
    restart: "no"
    command: >
      sh -c "apk add --no-cache gettext &&
             mkdir -p /dst/provisioning/datasources /dst/provisioning/dashboards /dst/dashboards/lux-mon &&
             cp /src/dashboards/* /dst/dashboards/lux-mon/ &&
             chown -R 472:472 /dst/provisioning /dst/dashboards &&
             chmod -R u+rw /dst/provisioning /dst/dashboards &&
             envsubst < /src/provisioning/datasources/influxdb.yaml > /dst/provisioning/datasources/influxdb.yaml &&
             sed -i 's|http://localhost:8086|http://influxdb:8086|g' /dst/provisioning/datasources/influxdb.yaml &&
             cp /src/provisioning/dashboards/dashboards.yaml /dst/provisioning/dashboards/dashboards.yaml &&
             chown -R 472:472 /dst/provisioning /dst/dashboards &&
             chmod -R u+rw /dst/provisioning /dst/dashboards &&
             echo Grafana provisioning prepared"

  grafana:
    image: grafana/grafana:latest
    container_name: lux-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${LUX_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${LUX_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - lux-grafana-provisioning:/etc/grafana/provisioning
      - lux-grafana-dashboards:/var/lib/grafana/dashboards
      - lux-grafana-data:/var/lib/grafana
    networks:
      - lux-mon-net
    depends_on:
      influxdb:
        condition: service_healthy
      grafana-init:
        condition: service_completed_successfully

volumes:
  lux-mariadb-data:
  lux-influxdb-data:
  lux-mosquitto-data:
  lux-mosquitto-logs:
  lux-grafana-data:
  lux-grafana-provisioning:
  lux-grafana-dashboards:

networks:
  lux-mon-net:
    driver: bridge
